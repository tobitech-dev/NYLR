<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register | NYLR 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#4a1c0b;--clay:#7a3414;--gold:#e9a319;--sky:#8cc9f5;--ink:#2a1006;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--sky),#e9f5fe 40%,#fffaf1);min-height:100vh;padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom,0px))}
.card{max-width:560px;margin:1rem auto;background:#fff;border-radius:22px;padding:1.6rem 1.3rem;box-shadow:0 20px 40px rgba(74,28,11,.2);animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
h1,h2{font-family:var(--serif);color:var(--brown);line-height:1.1}
h1{font-size:2.2rem}.sub{color:var(--clay);margin:.3rem 0 1rem}
label{display:block;font-weight:700;font-size:.95rem;margin:1rem 0 .3rem}label i{color:#c0392b;font-style:normal}
input,select,textarea{width:100%;font:inherit;padding:.85rem 1rem;border:2px solid #e6d5c3;border-radius:12px;background:#fffdf8;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,163,25,.25)}
.hp{position:absolute;left:-9999px}
button{width:100%;margin-top:1.6rem;font:700 1.05rem var(--sans);color:#fff;border:0;border-radius:999px;padding:1rem;cursor:pointer;background:linear-gradient(135deg,var(--clay),var(--brown));box-shadow:inset 0 0 0 2px var(--gold);transition:transform .2s}
button:active{transform:scale(.97)}button:disabled{opacity:.6}
.err{color:#c0392b;font-weight:700;margin-top:1rem;min-height:1.2em}
.ok{text-align:center;padding:2rem 0}.ok h2{font-size:2.3rem}.ok p{margin:.8rem 0 1.2rem}
a{color:var(--clay);font-weight:700}
</style></head>
<body><div class="card">
<a href="/">Back to home</a>
<h1 style="margin-top:1rem">Register for NYLR 2026</h1>
<p class="sub">Vessels Unto Honour | 6th to 8th November</p>
<form id="f" novalidate><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="fields"></div>
<p class="err" id="err" role="alert"></p><button id="go" type="submit">Submit registration</button></form>
<div class="ok" id="ok" hidden><h2>You're registered</h2><p>Thank you. We look forward to seeing you at the retreat.</p><a href="/">Back to home</a></div>
</div>
<script>
/* Add the real province names here, e.g. var PROVINCES=['Province 1','Province 2']; If empty, a text box shows instead. */
var PROVINCES=[];
var F=[['firstName','First name','text'],['surname','Surname','text'],['dob','Date of birth','date'],['gender','Gender','select',['Male','Female']],['phone','Phone number','tel'],['province','Select your province','province'],['coordinatorName','Name of Provincial Coordinator','text'],['coordinatorPhone','Phone number of Provincial Coordinator','tel'],['parentName',"Parent's name",'text'],['academicLevel','Academic level','select',['Secondary school','Awaiting Admission','Undergraduate','Graduate']],['parentPhone',"Parent's phone number",'tel'],['allergies','Any allergies? If yes, please share details','textarea'],['health','Any health challenges? If yes, please share details','textarea']];
var OPT={allergies:1,health:1},box=document.getElementById('fields');
F.forEach(function(x){
  var l=document.createElement('label');l.htmlFor=x[0];l.textContent=x[1]+' ';
  if(!OPT[x[0]]){var s=document.createElement('i');s.textContent='*';l.appendChild(s)}
  var el,opts=x[3];
  if(x[2]==='province'&&PROVINCES.length){x[2]='select';opts=PROVINCES}
  if(x[2]==='select'){el=document.createElement('select');var d=document.createElement('option');d.value='';d.textContent='Choose';el.appendChild(d);opts.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;el.appendChild(op)})}
  else if(x[2]==='textarea'){el=document.createElement('textarea');el.rows=2;el.maxLength=300}
  else{el=document.createElement('input');el.type=x[2]==='province'?'text':x[2];if(x[2]==='tel'){el.inputMode='tel';el.autocomplete='tel'}if(x[2]==='date')el.max=new Date().toISOString().slice(0,10)}
  el.id=el.name=x[0];box.appendChild(l);box.appendChild(el);
});
var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',function(e){
  e.preventDefault();err.textContent='';var data={};
  new FormData(f).forEach(function(v,k){data[k]=String(v).trim()});
  var miss=F.filter(function(x){return !OPT[x[0]]&&!data[x[0]]});
  if(miss.length){err.textContent='Please fill in: '+miss[0][1];document.getElementById(miss[0][0]).focus();return}
  go.disabled=true;go.textContent='Submitting...';
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(o){
    if(!o.ok)throw new Error(o.j.error||'Something went wrong.');
    f.hidden=true;document.getElementById('ok').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
  }).catch(function(x){err.textContent=x.message||'Network error. Check your connection and try again.';go.disabled=false;go.textContent='Submit registration'});
});
</script></body></html>
